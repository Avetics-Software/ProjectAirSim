# The swarm's config, for the sim (run_cesium_sim.sh) and for real drones
# (run_real.sh): the drones, how to reach them, and the ground station's
# settings. The sim's --drones, --pi-ip and --layer-step win over it. Every
# setting below is the default; delete what you don't change.

# --- Real drones only (run_real.sh). The sim makes its own MAVLink links. ---
# The MAVLink link carrying every drone (radio, mesh or mavlink-router), each
# drone with its own system id. Any pymavlink connection string, e.g.
# udpin:0.0.0.0:14560, udpout:192.168.1.10:14550, /dev/ttyUSB0,57600.
# 14560 rather than 14550 so QGC (which listens on 14550) can run alongside.
mavlink: udpin:0.0.0.0:14560
gcs_sysid: 245                  # our MAVLink system id; not 255 (QGC's)
# home: [1.413425, 103.865000]  # map origin; else the first drone's first position

# --- The drones, in order: Drone1, Drone2, ... ---
# Real drones: name, sysid (its PX4's MAV_SYS_ID), video (its gimbal camera's
#   stream) and companion (its Radxa running X; the camera is then X's).
#   Optional: mavlink (this drone on its own link), chase_video (a second camera).
# The sim: one PX4 per entry, named Drone1, Drone2, ...; it uses only
#   `companion` (a Radxa running X's rknn-sim profile) and makes the rest itself.
drones:
  - name: Drone1
    sysid: 1
    # video: rtsp://192.168.144.25:8554/main
    companion: 192.168.199.99
  # - name: Drone2
  #   sysid: 2
  #   video: rtsp://192.168.144.26:8554/main
  #   companion: 192.168.199.100

swarm:
  layer_step_m: 5               # drone N flies (N-1) x this above the height asked for,
                                #   so crossing routes pass at different heights; 0 = all
                                #   at the same height
  default_alt_m: 30             # takeoff / search height when none is given (above home)
  formation_spacing_m: 15       # several drones sent to one point line up this far apart
  search_spacing_m: 40          # pass spacing for `search` when none is given
  arrive_m: 4                   # a goto has arrived within this (then turns to its heading)
  waypoint_timeout_s: 180       # give up on a goto after this (plus 2 s per metre to fly)

deconfliction:
  separation_h_m: 6             # closer than this horizontally...
  separation_v_m: 3             # ...and this vertically is a conflict
  lookahead_s: 6                # predict conflicts this far ahead
  give_way_climb_m: 6           # the drone giving way stops and climbs this much...
  clear_h_m: 10                 # ...and resumes once this far away and not closing
  max_gps_margin_m: 10          # cap on the extra separation for GPS inaccuracy

safety:
  battery_warn_pct: 30
  battery_act_pct: 20
  battery_action: rtl           # rtl | land | warn, at battery_act_pct
  link_lost_s: 3                # no message for this long = link lost
  min_position_rate: 2          # positions/s; fewer = weak link
  gps_min_sats: 8
  gps_max_eph_m: 2.5
  fence_margin_m: 10            # warn this close to the geofence
  fence_max_alt_m: 120          # geofence ceiling, above home
  fence_action: rtl             # what PX4 does at the fence: warn | hold | rtl | land
  lost_margin_m: 15             # others keep this far from a lost drone's last position

controls:
  gimbal_step_deg: 3            # each W/A/S/D press (drones without a companion)
  zoom_step_percent: 5          # each wheel notch or +/- (drones without a companion)
  companion_zoom_pulse_s: 0.4   # with a companion: each notch zooms this long
