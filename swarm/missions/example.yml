# An example mission: two drones fly out side by side, look at a point with
# their cameras, sweep back with fixed camera angles and come home.
#   mission load example   then   mission upload   then   mission start
# See docs/features/missions.md for every step.
mission: example
origin: start            # north/east: metres from where each drone is at upload
speed: 6                 # m/s

drones:
  Drone1:
    steps:
      - takeoff: 30
      - goto: {north: 80, east: 0, alt: 30}
        heading: 0                        # nose north from here on, until another heading
        gimbal: {pitch: -30, yaw: 0}      # on arrival: 30 deg down, straight ahead
        hold: 3
      - look_at: {north: 140, east: 40}   # the camera points at this ground point,
                                          #   re-aimed at each waypoint...
      - goto: {north: 80, east: 60, alt: 30}
        heading: 90
      - wait: 5
      - look_at: none                     # ...until here
      - gimbal: {pitch: -45, heading: 180}  # 45 down, facing south whatever the nose does
      - goto: {north: 0, east: 60, alt: 30}
        heading: 270
      - photo: true
      - rtl: true

  Drone2:
    speed: 5
    steps:
      - takeoff: 40
      - goto: {north: 80, east: -40, alt: 40}
        heading: 45
        gimbal: {pitch: -60, yaw: 30}
        hold: 5
      - goto: {north: 0, east: -40, alt: 40}
      - land: true
