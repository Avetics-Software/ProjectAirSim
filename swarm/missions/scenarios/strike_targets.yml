# Actors for the strike missions (strike_quad.yml, strike_fw.yml).
#
# Replicable by construction: fixed positions, fixed seeds/routes. `mission
# start` respawns them at their seeded places, so every run sees the same
# geometry.
#
# TargetVehicle sits on the runway about 120 m north-east of the Seletar spawn
# (heading 033), clear of the ground clutter and inside the fixed forward
# camera's view from the quad's hover. It stands still for ten minutes before
# creeping 13 m, so over a strike run it is a static target — the case the
# sim profiles' TARGET_MOTION: "STATIC" is tuned for. Change it to "MOVING" in
# X's profile to exercise the constant-velocity fit, and give it a longer path.
#
# Traffic is a car working along the roads near the target: something for the
# tracker and, if it is selected instead, for the moving-target path. It is
# not the strike target unless the operator picks it.
defaults:
  vehicle: {asset: SKM_SportsCar, length: 4.5, align_to_ground: true}

actors:
- name: TargetVehicle
  kind: vehicle
  speed: 0.5
  start_delay: 600
  mode: once
  follow_roads: false
  waypoints:
  - [1.414329, 103.865587]
  - [1.414420, 103.865700]

- name: Traffic
  kind: vehicle
  speed: 10
  start_delay: 20
  mode: loop
  waypoints:
  - [1.409005, 103.862289]
  - [1.415268, 103.866441]
