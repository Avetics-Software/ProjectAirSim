# Actors for the strike missions (strike_quad.yml, strike_fw.yml).
#
# Replicable by construction: fixed positions, fixed seeds/routes. `mission
# start` respawns them at their seeded places, so every run sees the same
# geometry.
#
# TargetVehicle sits on the road at the junction north-east of the Seletar
# spawn (1.415268, 103.866441), not on the featureless runway: the pixel
# tracker needs background texture to hold. It stands still for ten minutes
# before creeping 13 m, so over a strike run it is a static target — the case
# the sim profiles' TARGET_MOTION: "STATIC" is tuned for. Change it to
# "MOVING" in X's profile to exercise the constant-velocity fit, and give it a
# longer path.
#
# Traffic works the road short of the target, so there is something else for
# the tracker and, if the operator selects it instead, for the moving-target
# path. It is not the strike target.
defaults:
  vehicle: {asset: SKM_SportsCar, length: 4.5, align_to_ground: true}

actors:
- name: TargetVehicle
  kind: vehicle
  speed: 0.5
  start_delay: 600
  mode: once
  follow_roads: false
  waypoints:
  - [1.415268, 103.866441]
  - [1.415366, 103.866507]

- name: Traffic
  kind: vehicle
  speed: 10
  start_delay: 20
  mode: pingpong
  waypoints:
  - [1.409005, 103.862289]
  - [1.412500, 103.864300]
