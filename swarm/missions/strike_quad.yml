# Strike test, quadrotor (pitch-only camera profile).
#
# The quad holds at a 90 m stand-off from TargetVehicle, which sits on the road
# at the junction (textured ground, so the pixel tracker can hold it), 50 m up
# and on the approach heading. `track` hands the camera to X and lets it lock
# onto the target from ground truth (the same hand-over an operator's click
# makes); X then owns the gimbal and the target-state estimator runs on the
# drone's own motion.
#
#   ./run_cesium_sim.sh --qgc --drones 1 --model quad_px4 \
#       --config config.yml --companion <this-laptop-ip>
#   mission load strike_quad
#   mission upload
#   mission start
#   (with X's rknn-sim-quad-px4 profile running on the companion)
#
# Then, in the map-plot client or the dashboard, arm STRIKE. X's strike profile
# takes over: if the estimate is not yet observable it flies the survey (a
# lateral/descending move), then hands the run to the strike law. Releasing
# STRIKE returns the sticks; the mission's hold and RTL continue.
#
# Fixed-wing sibling: strike_fw.yml, same target and scenario.
mission: strike_quad
origin: home
speed: 6
actors: scenarios/strike_targets.yml
# Uploaded by `mission upload`, before the mission. Home, the stand-offs (all
# on the approach line between home and the target) and the target are
# inside, with about 100 m to spare around the target for X's survey move and
# the strike run. The ceiling is the config's; keep it above the hold height
# plus fence_margin_m (10 m).
fence:
  corners:                  # metres north/east of home
    - {north: -100, east: -100}
    - {north: 320, east: -100}
    - {north: 320, east: 280}
    - {north: -100, east: 280}
  ceiling: 170

drones:
  Drone1:
    steps:
      - takeoff: 50
      # 90 m short of the target, on the road's approach heading (033).
      - goto: {lat: 1.414593, lon: 103.865995, alt: 50}
        heading: 33
      # Point the camera at the target for the hand-over; `track` then gives it
      # to X, which keeps it centred and starts estimating.
      - look_at: {lat: 1.415268, lon: 103.866441, alt: 12}
      - track: {target: TargetVehicle, tracker: x}
      - hold: 120          # arm STRIKE in this window
      - rtl: true
